<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Experiment lang i2</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin-style.css" />

    <style>
      body {
        background: linear-gradient(135deg, #1e293b, #006633) !important;
        min-height: 100vh;
      }

      .experiment-container {
        padding: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 40px;
        perspective: 1000px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .glass-3d-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 25px;
        padding: 25px;
        color: white;
        box-shadow:
          15px 15px 30px rgba(0, 0, 0, 0.4),
          -5px -5px 15px rgba(255, 255, 255, 0.03);
        transition:
          box-shadow 0.4s ease-out,
          transform 0.1s ease-out;
        transform-style: preserve-3d;
      }

      .glass-3d-card:hover {
        box-shadow: 25px 25px 50px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(250, 204, 21, 0.4);
      }

      .widget-title {
        color: #facc15;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 20px;
        display: block;
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        transform: translateZ(30px);
      }

      .calendar-frame {
        border-radius: 15px;
        filter: invert(0.9) hue-rotate(180deg);
        width: 100%;
        height: 300px;
        background: white;
        transform: translateZ(20px);
      }

      .weather-wrap,
      .spotify-wrap {
        transform: translateZ(20px);
      }
    </style>
  </head>
  <body>
    <header
      class="top-nav admin-header-nav"
      style="background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px)"
    >
      <div class="header-main-row">
        <div class="logo-container">
          <img src="images/feurlogo.png" alt="Logo" class="logo-img" />
          <h2 class="logo-text" style="color: white">Widget Preview</h2>
        </div>
      </div>
    </header>

    <main class="main-content" style="padding-top: 100px">
      <h1
        style="
          color: white;
          text-align: center;
          text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
          margin-bottom: 30px;
        "
      >
        3D Glass Dashboard Practice hihi:D
      </h1>

      <div class="experiment-container">
        <div class="glass-3d-card">
          <span class="widget-title">Live Weather Update</span>
          <div class="weather-wrap">
            <div
              id="ww_782d511ff438f"
              v="1.3"
              loc="auto"
              a='{"t":"horizontal","lang":"en","sl_lpl":1,"ids":[],"font":"Arial","sl_ics":"one_a","sl_sot":"celsius","cl_bkg":"image","cl_font":"#FFFFFF","cl_cloud":"#FFFFFF","cl_persp":"#81D4FA","cl_sun":"#FFC107","cl_moon":"#FFC107","cl_thund":"#FF5722"}'
            >
              <a
                href="https://weatherwidget.org/"
                id="ww_782d511ff438f_u"
                target="_blank"
                >HTML Weather Widget for website</a
              >
            </div>
          </div>
        </div>

        <div class="glass-3d-card">
          <span class="widget-title">Campusz Calendar</span>
          <iframe
            src="https://calendar.google.com/calendar/embed?src=en.philippines%23holiday%40group.v.calendar.google.com&ctz=Asia%2FManila"
            class="calendar-frame"
            frameborder="0"
            scrolling="no"
          ></iframe>
        </div>

        <div
          class="glass-3d-card"
          style="
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
          "
        >
          <span class="widget-title">Now Playing</span>
          <div class="spotify-wrap" style="width: 100%">
            <iframe
              data-testid="embed-iframe"
              style="border-radius: 12px; max-width: 100%; border: none"
              src="https://open.spotify.com/embed/track/1BxfuPKGuaTgP7aM0Bbdwr?utm_source=generator"
              width="100%"
              height="152"
              frameborder="0"
              allowfullscreen=""
              allow="
                autoplay;
                clipboard-write;
                encrypted-media;
                fullscreen;
                picture-in-picture;
              "
              loading="lazy"
            ></iframe>
          </div>
        </div>
      </div>
    </main>

    <script
      async
      src="https://app3.weatherwidget.org/js/?id=ww_782d511ff438f"
    ></script>

    <script
      src="//code.tidio.co/utrn5uimu1asbvg0la0z1vw4pxnvopcz.js"
      async
    ></script>

    <script>
      const cards = document.querySelectorAll(".glass-3d-card");

      cards.forEach((card) => {
        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = ((y - centerY) / centerY) * -15;
          const rotateY = ((x - centerX) / centerX) * 15;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)`;
        });
      });
    </script>
  </body>
</html>
