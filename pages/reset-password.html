<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - FEUR Events</title>
    <link rel="stylesheet" href="../css/components/base.css" />
    <link rel="stylesheet" href="../css/components/layout.css" />
    <link rel="stylesheet" href="../css/components/components.css" />
    <link rel="stylesheet" href="../css/components/signinup.css" />
    <link rel="manifest" href="../manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="../images/feurlogo.png" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <a href="../index.html"><img src="../images/feurlogo.png" alt="FEUR Logo" /></a>
      <h2>Create New Password</h2>
      <form id="reset-password-form">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="new-password" placeholder="Enter new password" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-new-password" placeholder="Confirm new password" required />
        </div>
        <div class="form-options">
          <input type="checkbox" id="show-new-password" />
          <label for="show-new-password">Show Passwords</label>
        </div>
        <button type="submit" id="update-pwd-btn" class="btn-auth">
          Update Password
        </button>
      </form>
    </div>

    <div id="custom-alert" class="modal-overlay hidden">
      <div class="modal-box alert-box">
        <h3 id="alert-title">System</h3>
        <p id="alert-message"></p>
        <button id="close-alert" class="btn-solid" style="background: #006633; color: white;">OK</button>
      </div>
    </div>
    
    <script type="module" src="../js/modules/main.js"></script>
  </body>
</html>
