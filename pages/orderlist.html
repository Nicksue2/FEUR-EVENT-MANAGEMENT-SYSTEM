<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order List - FEU Roosevelt Events</title>
    <link rel="stylesheet" href="../css/components/base.css" />
    <link rel="stylesheet" href="../css/components/layout.css" />
    <link rel="stylesheet" href="../css/components/components.css" />
    <link rel="stylesheet" href="../css/components/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="icon" type="image/x-icon" href="../images/feurlogo.png" />
    <link rel="manifest" href="../manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="../images/feurlogo.png" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-left">
        <button id="burger-btn" class="icon-btn">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>
        <div class="search-container">
          <svg
            class="search-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="text" id="search-input" placeholder="Search events..." />
        </div>
      </div>

      <div class="logo-container">
        <a href="../index.html" class="logo-link">
          <img src="../images/feurlogo.png" alt="FEUR Logo" class="logo-img" />
          <h2 class="logo-text">FEUR Events</h2>
        </a>
      </div>

      <div class="nav-right">
        <select id="campus-select" class="campus-dropdown">
          <option value="All" selected>FEU Roosevelt Campuses (All)</option>
          <option value="Cainta">Cainta</option>
          <option value="Marikina">Marikina</option>
          <option value="Rodriguez">Rodriguez</option>
        </select>

        <div id="auth-user-view" class="hidden user-only">
          <div class="notif-container">
            <button id="notif-btn" class="icon-btn">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </button>
            <div id="notif-modal" class="modern-modal hidden">
              <h4>Notifications</h4>
              <div class="notif-list" id="notif-list">
                <div class="loading-text">Loading...</div>
              </div>
            </div>
          </div>
          <div id="user-greeting" class="user-greeting">Welcome!</div>
        </div>

        <div id="guest-view" class="auth-buttons guest-only">
          <a href="signin.html" class="btn btn-outline">Log In</a>
          <a href="signup.html" class="btn btn-solid">Sign Up</a>
        </div>
      </div>
    </header>

    <div class="layout-container">
      <aside id="sidebar" class="sidebar"></aside>

      <main class="main-content">
        <div class="header-section">
          <h2>Registered Events</h2>
          <p>Events you have successfully registered for.</p>
        </div>
        <div id="orders-grid" class="events-grid">
          <p class="loading-text">Loading your tickets...</p>
        </div>
      </main>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 class="modal-header-color">Settings</h3>
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="switch"
            ><input type="checkbox" id="dark-toggle" /><span
              class="slider"
            ></span
          ></label>
        </div>
        <div class="setting-item">
          <span>Outlook Email Updates</span>
          <label class="switch"
            ><input type="checkbox" id="email-notif-toggle" checked /><span
              class="slider"
            ></span
          ></label>
        </div>
        <button id="close-settings" class="btn btn-solid full-width-mt20">
          Save & Close
        </button>
      </div>
    </div>

    <div id="custom-alert" class="modal-overlay hidden">
      <div class="modal-box alert-box">
        <div class="alert-icon">⚠️</div>
        <h3 id="alert-title">Notification</h3>
        <p id="alert-message" class="alert-margin"></p>
        <button id="close-alert" class="btn btn-solid w-100">OK</button>
      </div>
    </div>

    <div id="custom-confirm" class="modal-overlay hidden">
      <div class="modal-box alert-box">
        <h3 id="confirm-title" style="color: var(--primary)">Confirm Action</h3>
        <p id="confirm-message" class="alert-margin"></p>
        <div style="display: flex; gap: 10px; margin-top: 20px">
          <button id="confirm-cancel-btn" class="btn btn-outline w-100">
            Cancel
          </button>
          <button id="confirm-ok-btn" class="btn btn-solid w-100">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div id="qr-modal" class="modal-overlay hidden">
      <div class="modal-box qr-modal-box">
        <h3 id="qr-event-title" class="qr-title">Event Title</h3>
        <div id="qr-code-image" class="qr-image-container"></div>
        <button id="close-qr-modal" class="btn btn-solid qr-close-btn">
          Close
        </button>
      </div>
    </div>

    <script type="module" src="../js/modules/main.js"></script>
  </body>
</html>
