<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Maps - FEUR Events</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="maps.css" />
    <link rel="icon" type="image/x-icon" href="images/feurlogo.png" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-left">
        <a href="index.html" class="icon-btn" style="text-decoration: none">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </a>
      </div>
      <a href="index.html" class="logo-link">
      <div class="logo-container">
        <div class="logo-link">
          <img src="images/feurlogo.png" alt="FEUR Logo" class="logo-img" />
          <h2 class="logo-text">Campus Maps</h2>
        </div>
      </div>
      </a>
      <div class="nav-right" style="width: 40px"></div>
    </header>

    <main class="main-content" style="display: flex; justify-content: center">
      <div
        class="maps-card"
        style="width: 100%; max-width: 900px; margin-top: 20px"
      >
        <div class="campus-buttons">
          <button
            class="btn btn-solid map-btn"
            onclick="showMap(event, 'marikina')"
          >
            Marikina
          </button>
          <button
            class="btn btn-outline map-btn"
            onclick="showMap(event, 'cainta')"
          >
            Cainta
          </button>
          <button
            class="btn btn-outline map-btn"
            onclick="showMap(event, 'rodriguez')"
          >
            Rodriguez
          </button>
        </div>

        <div
          style="
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
          "
        >
          <button
            class="btn btn-solid mode-btn"
            onclick="setViewMode('street')"
            id="btn-street"
            style="padding: 6px 15px; font-size: 13px"
          >
            🛣️ Street View
          </button>
          <button
            class="btn btn-outline mode-btn"
            onclick="setViewMode('map')"
            id="btn-map"
            style="padding: 6px 15px; font-size: 13px"
          >
            🗺️ 2D Map
          </button>
        </div>

        <div class="map-container" id="map-marikina">
          <iframe
            class="street-frame"
            src="https://www.google.com/maps/embed?pb=!3m2!1sen!2sph!4v1776335605709!5m2!1sen!2sph!6m8!1m7!1s3E3-yy2h7oszhlTkDHApgw!2m2!1d14.64899883027582!2d121.0978162637016!3f144.4360562883602!4f-11.046306675367106!5f0.7820865974627469"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
          <iframe
            class="map-frame hidden"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3860.1277929732423!2d121.09590637507502!3d14.64868637589762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397b9c6ec2be07f%3A0x3aa915a32f155809!2sFEU%20Roosevelt%20Marikina!5e0!3m2!1sen!2sph!4v1776336332272!5m2!1sen!2sph"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>

        <div class="map-container hidden" id="map-cainta">
          <iframe
            class="street-frame"
            src="https://www.google.com/maps/embed?pb=!3m2!1sen!2sph!4v1776335645167!5m2!1sen!2sph!6m8!1m7!1sc9DLfe8VvJOQ61ISl3yz1Q!2m2!1d14.63351081807875!2d121.1092142849736!3f208.82432095646428!4f2.7537964541655384!5f0.7820865974627469"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
          <iframe
            class="map-frame hidden"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3860.4066617321823!2d121.10650357507478!3d14.632842376286485!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397b84cc93cce79%3A0xa8be99b659713e0f!2sFEU%20Roosevelt%20Cainta!5e0!3m2!1sen!2sph!4v1776336347632!5m2!1sen!2sph"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>

        <div class="map-container hidden" id="map-rodriguez">
          <iframe
            class="street-frame"
            src="https://www.google.com/maps/embed?pb=!3m2!1sen!2sph!4v1776335686807!5m2!1sen!2sph!6m8!1m7!1sMBsJD5D1b41vXrZyIO2Jnw!2m2!1d14.72821324228507!2d121.1394946088203!3f92.5766087537989!4f5.990287064236668!5f0.7820865974627469"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
          <iframe
            class="map-frame hidden"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15434.894357038738!2d121.1394946088203!3d14.72821324228507!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397bb16dd695dc1%3A0xf041fc25e18a4639!2sFEU%20Roosevelt%20Rodriguez!5e0!3m2!1sen!2sph!4v1776336310941!5m2!1sen!2sph"
            width="100%"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </main>

    <script>
      function showMap(e, campus) {
        document
          .querySelectorAll(".map-container")
          .forEach((el) => el.classList.add("hidden"));
        document.querySelectorAll(".map-btn").forEach((btn) => {
          btn.classList.remove("btn-solid");
          btn.classList.add("btn-outline");
        });
        document.getElementById("map-" + campus).classList.remove("hidden");
        e.target.classList.remove("btn-outline");
        e.target.classList.add("btn-solid");
      }

      function setViewMode(mode) {
        document.getElementById("btn-street").className =
          mode === "street"
            ? "btn btn-solid mode-btn"
            : "btn btn-outline mode-btn";
        document.getElementById("btn-map").className =
          mode === "map"
            ? "btn btn-solid mode-btn"
            : "btn btn-outline mode-btn";

        if (mode === "street") {
          document
            .querySelectorAll(".street-frame")
            .forEach((el) => el.classList.remove("hidden"));
          document
            .querySelectorAll(".map-frame")
            .forEach((el) => el.classList.add("hidden"));
        } else {
          document
            .querySelectorAll(".street-frame")
            .forEach((el) => el.classList.add("hidden"));
          document
            .querySelectorAll(".map-frame")
            .forEach((el) => el.classList.remove("hidden"));
        }
      }
    </script>
  </body>
</html>
